name: PHP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP lint and application smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Report PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Check PHP syntax
        run: |
          php -l index.php
          php -l data.php

      - name: Validate Composer configuration when present
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
            composer install --no-interaction --prefer-dist
          else
            echo "No composer.json found; this project has no Composer dependencies."
          fi

      - name: Test the application through PHP's development server
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          cp index.php data.php names.txt "$TEST_DIR/"
          php -S 127.0.0.1:8080 -t "$TEST_DIR" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            rm -rf "$TEST_DIR"
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --show-error --fail http://127.0.0.1:8080/ > "$RUNNER_TEMP/home.html"
          grep -q "Name Corrector" "$RUNNER_TEMP/home.html"

          curl --silent --show-error --fail \
            --data-urlencode "name=A&B <Test>" \
            http://127.0.0.1:8080/ > "$RUNNER_TEMP/post.html"
          grep -q "Name saved successfully" "$RUNNER_TEMP/post.html"

          curl --silent --show-error --fail http://127.0.0.1:8080/data.php > "$RUNNER_TEMP/data.html"
          grep -Fq "A&amp;B &lt;Test&gt;" "$RUNNER_TEMP/data.html"

          echo "PASS: homepage loads, a name is saved, and saved data is safely HTML-escaped."
